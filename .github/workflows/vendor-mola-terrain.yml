name: Vendor Mars terrain and colour data

on:
  workflow_dispatch:
  push:
    branches: [development]
    paths-ignore:
      - 'data/mola/megt90n000cb.img'
      - 'data/mars/8k_mars.jpg'

permissions:
  contents: write

jobs:
  fetch-mola:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Download and validate official NASA/PDS MOLA grid
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/mola data/mars
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://pds-geosciences.wustl.edu/mgs/urn-nasa-pds-mgs_mola_topography_derived/meg004/megt90n000cb.img' \
            --output data/mola/megt90n000cb.img
          actual_bytes="$(wc -c < data/mola/megt90n000cb.img | tr -d ' ')"
          expected_bytes=2073600
          if [ "$actual_bytes" -ne "$expected_bytes" ]; then
            echo "Unexpected MOLA file size: $actual_bytes bytes; expected $expected_bytes" >&2
            exit 1
          fi
          echo "Validated official MOLA grid: $actual_bytes bytes"
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.solarsystemscope.com/textures/download/8k_mars.jpg' \
            --output data/mars/8k_mars.jpg
          texture_bytes="$(wc -c < data/mars/8k_mars.jpg | tr -d ' ')"
          if [ "$texture_bytes" -lt 1000000 ] || [ "$(head -c 2 data/mars/8k_mars.jpg | od -An -tx1 | tr -d ' \n')" != "ffd8" ]; then
            echo "Mars colour texture failed size or JPEG-signature validation: $texture_bytes bytes" >&2
            exit 1
          fi
          echo "Validated Mars colour texture: $texture_bytes bytes"

      - name: Commit terrain data to development
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/mola/megt90n000cb.img data/mars/8k_mars.jpg
          if git diff --cached --quiet; then
            echo 'MOLA terrain file already present; nothing to commit.'
            exit 0
          fi
          git commit -m 'Vendor Mars topography and colour texture'
          git push origin HEAD:development
